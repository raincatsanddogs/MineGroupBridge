# ===================================================
# 机器人状态监控与邮件告警配置文件
# ===================================================

# 是否启用状态监控与邮件告警总开关
enabled: true

# 接收告警邮件的目标邮箱列表（支持配置多个）
recipients:
  - "your_email@example.com"

# ---------------------------------------------------
# 监控与频控策略
# ---------------------------------------------------

# 心跳轮询周期（秒）：定时通过 OneBot 的 get_status 接口检测 QQ 在线状态
check_interval_seconds: 30

# QQ 离线确认阈值：连续几次检测到 online=False 后触发告警（防偶发网络抖动）
offline_threshold: 2

# 状态接口异常阈值：连续几次调用 get_status 失败/超时后触发告警
error_threshold: 3

# 恢复正常确认阈值：故障后连续几次检测为在线，才判定恢复并发送恢复通知邮件
recovery_threshold: 2

# 同一故障事故的冷却间隔（秒）：避免短时间内重复发送大量告警邮件（默认 10 分钟）
cooldown_seconds: 600

# 当机器人恢复上线后，是否发送恢复正常通知邮件
send_recovery_notice: true

# 监控的适配器类型列表（包含 onebot, minecraft, qq）
monitor_adapters:
  - "onebot"
  - "minecraft"
  - "qq"

# ---------------------------------------------------
# 防抖与震荡保护（防止重启误报与频繁消耗额度）
# ---------------------------------------------------

# 断连防抖等待时间（秒）：断开后等待若干秒，若迅速重连则忽略；若多个机器人同时断连则自动合并为一封邮件
disconnect_debounce_seconds: 5

# 发信前通用宽限期缓冲时间（秒）：任何告警或恢复邮件发出前等待若干秒，若有多个消息相继到达则自动合并为一封邮件发出（默认 5 秒）
notification_grace_period_seconds: 5

# 频繁震荡统计窗口（秒，默认 1 小时）
flapping_window_seconds: 3600

# 窗口内触发震荡状态的故障次数阈值（达到后判定为不稳定震荡，暂停发送恢复上线邮件）
flapping_threshold: 3

# 处于震荡状态下的告警冷却间隔（秒，默认 30 分钟）
flapping_cooldown_seconds: 1800

# 退出震荡状态所需的持续稳定运行秒数（默认持续正常 30 分钟后才发送最终恢复报告）
flapping_stable_seconds: 1800

# ---------------------------------------------------
# 邮件发送后端设置
# ---------------------------------------------------

# 发信方式：可选 "smtp"（原生标准协议，零外部依赖）或 "agent_mail"（调用 agently-cli）
backend: "smtp"

# 当 backend 为 smtp 时的配置
smtp:
  host: "smtp.example.com"      # SMTP 服务器地址（如 smtp.qq.com）
  port: 465                     # SMTP 端口（SSL 通常为 465，STARTTLS 为 587，明文为 25）
  security: "ssl"               # 加密模式：可选 "ssl"、"starttls" 或 "plain"
  username: "your_bot@example.com" # 发信账号
  password: "your_auth_code_or_password" # 邮箱授权码或密码
  from_name: "MineGroupBridge Monitor" # 发件人显示名称

# 当 backend 为 agent_mail 时的配置（使用腾讯 Agent 原生邮箱）
agent_mail:
  # agently-cli 命令行名称或完整路径
  cli_command: "agently-cli"
  # 每日最大发信上限：0 为自动读取云端 rate_limits 限制，大于0则作为固定硬上限进行拦截
  daily_send_limit: 0
